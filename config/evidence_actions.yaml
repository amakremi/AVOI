  doc_mfa_exception_register: {source_type: register_record,    method: examine, scf_erl: null,       privacy: [user_identifier]}
  kc_realm_browser_flow:     {source_type: configuration_state, method: examine, scf_erl: E-IAM-06,   privacy: []}
  kc_client_flow_overrides:  {source_type: configuration_state, method: examine, scf_erl: E-IAM-06,   privacy: []}
  test_mfa_login_sample:     {source_type: technical_test,      method: test,    scf_erl: null,       privacy: [user_identifier, authentication_event, role_group_membership]}
