# Evidence-action catalogue (controlled IAM testbed + common evidence-source ontology for public replay).
#
# privacy_categories: sensitive field categories an acquisition reveals to the assessor/agent.
# PrivacyExposure(a) = |categories revealed by a| / |defined categories|  (experimental proxy, not a privacy-risk valuation)
# Categories are recorded per observation by the collector from the fields actually present in the raw artifact;
# the list below is the declared schema that collectors check against.

sensitive_categories:
  - user_identifier
  - email_address
  - ip_address
  - host_device_identifier
  - role_group_membership
  - authentication_event
  - file_activity
  - communication_content
  - security_incident_information
  - hr_employment_record

# Common evidence-source ontology (Layer C mapping across domains)
source_ontology:
  policy_document: "Documentary policy/procedure/standard"
  register_record: "Governance register or approval/review record"
  ticket_record: "Ticket / remediation / emergency change record"
  hr_record: "HR system-of-record export"
  directory_state: "Identity directory state (users, roles, groups, attributes, credentials)"
  configuration_state: "Security configuration (authentication flows, client bindings)"
  reconciliation: "Cross-source reconciliation computed by the collector"
  authentication_log: "Authentication / login events"
  audit_log: "Administrative audit events"
  host_state: "Operating-system host state"
  technical_test: "Active technical test (SP 800-53A TEST method)"
  device_activity: "Removable-device activity"
  file_activity: "File activity"
  network_observation: "Network / web / DNS / IDS observation"
  communication_record: "E-mail / communication metadata"
  system_log: "General system / application log"

iam_actions:
