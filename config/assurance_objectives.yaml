# AVOI-GRC controlled IAM testbed: atomic assessment objectives.
#
# IMPORTANT: each predicate below is an EXPERIMENTAL OPERATIONAL PREDICATE evaluated on the Docker testbed.
# It is inspired by the referenced framework requirements but is NOT a legal or regulatory interpretation of them,
# and a satisfied predicate is NOT a compliance/certification determination.
#
# Framework references were extracted from the downloaded sources (see data/processed/grounding/):
#   NIST SP 800-53A Rev.5 assessment objectives (CSV), SCF 2026.2 (controls, Evidence Request List "ERL"),
#   NCA ECC-2:2024 (English PDF). SCF 2026.2 only carries an ECC-1:2018 mapping; ECC-2:2024 clause numbers
#   were read from the ECC-2:2024 document itself.
#
# Y = 1  objective satisfied (predicate true on the live testbed configuration)
# Y = 0  objective violated
#
# Outcome 'nominal' is a human-readable reading of an outcome (supports_satisfied / supports_violated / neutral).
# It is used ONLY by the "no learned reliability" ablation; all main models learn P(O | Y) from training data.

assessment_parameters:
  dormancy_threshold_days: 90
  access_review_max_age_days: 90
  termination_grace_days: 1
  event_window_days: 90
  login_test_sample_size: 2
  events_api_page_size: 60

objectives:
  - id: IAM-01-MFA-PRIV
    title: Privileged human accounts are subject to enforced multi-factor authentication
    framework_refs:
      nist_800_53: ["IA-02(01)"]
      nist_800_53a: ["IA-02(01) - multi-factor authentication is implemented for access to privileged accounts"]
      nca_ecc_2_2024: ["2-2-3-2 (MFA for remote access and privileged accounts)"]
      scf: ["IAC-06", "IAC-06.1"]
    operational_predicate: >
      For every ENABLED human account that effectively holds realm role priv_admin (directly, via group, or via a
      composite role), a browser-flow login with the correct password through EVERY client that has the standard
      (browser) flow enabled results in an OTP challenge or mandatory OTP enrolment before a session is issued.
      Break-glass and service accounts are out of scope of this objective.
    ground_truth_source: live exhaustive login test by the oracle over all in-scope users x clients (testbed/oracle.py)
    actions:
      - id: doc_mfa_policy
        outcomes: {mandates_priv_mfa: supports_satisfied, no_priv_mfa_clause: supports_violated, not_found: neutral}
      - id: doc_mfa_exception_register
        outcomes: {no_exceptions: supports_satisfied, exceptions_listed: supports_violated, not_found: neutral}
      - id: kc_realm_browser_flow
        outcomes: {otp_enforced_priv_role: supports_satisfied, otp_conditional_other_role: supports_violated, otp_not_enforced: supports_violated}
      - id: kc_client_flow_overrides
        outcomes: {no_overrides: supports_satisfied, overrides_present: supports_violated}
      - id: test_mfa_login_sample
        outcomes: {all_challenged: supports_satisfied, bypass_observed: supports_violated}
      - id: kc_priv_user_credentials
        outcomes: {all_priv_have_otp: supports_satisfied, some_priv_without_otp: supports_violated}
      - id: kc_auth_events_priv
        outcomes: {only_default_client_logins: supports_satisfied, nondefault_client_logins: supports_violated, no_events: neutral}

  - id: IAM-02-TERM-DISABLED
    title: Accounts of terminated personnel are disabled
    framework_refs:
      nist_800_53: ["AC-02", "PS-04"]
      nist_800_53a: ["PS-04a - system access is disabled within the defined time period of individual termination", "AC-02h.02 - account managers notified when users are terminated"]
      nca_ecc_2_2024: ["1-9-5 (powers reviewed and revoked upon end/termination of employment)"]
      scf: ["IAC-07.2", "HRS-09"]
      scf_erl: ["E-HRS-19 Deprovisioning Checklist (Offboarding)", "E-HRS-29 Personnel Actions Documentation"]
    operational_predicate: >
      Every Keycloak account that belongs (per the authoritative identity registry) to a person whose employment was
      terminated at least termination_grace_days before the assessment time is disabled or deleted.
    ground_truth_source: oracle join of hidden identity registry + HR system of record + live Keycloak account state
    actions:
      - id: doc_offboarding_procedure
        outcomes: {documented_with_sla: supports_satisfied, not_found: neutral}
      - id: hr_termination_feed
        outcomes: {no_terminations: supports_satisfied, terminations_present: neutral}
      - id: ticket_offboarding_records
        outcomes: {all_closed: supports_satisfied, open_or_missing: supports_violated, not_found: neutral}
      - id: kc_disabled_accounts
        outcomes: {none_disabled: supports_violated, some_disabled: supports_satisfied}
      - id: recon_hr_vs_directory
        outcomes: {all_terminated_disabled: supports_satisfied, enabled_terminated_found: supports_violated, unlinked_accounts_present: neutral}
      - id: kc_login_events_post_termination
        outcomes: {none_observed: supports_satisfied, post_termination_logins: supports_violated}

  - id: IAM-03-PRIV-AUTHZ
    title: Privileged-role membership matches approved authorization
    framework_refs:
      nist_800_53: ["AC-06(05)", "AC-02"]
      nist_800_53a: ["AC-06(05) - privileged accounts restricted to defined personnel or roles", "AC-02d - authorized users of the system are specified"]
      nca_ecc_2_2024: ["2-2-3-3 (least privilege)", "2-2-3-4 (privileged access management)"]
      scf: ["IAC-21.3", "IAC-16", "IAC-16.1"]
      scf_erl: ["E-IAM-09 Access Authorization Records", "E-IAM-03 Privileged User Inventory", "E-IAM-08 Conditions for Group / Role Membership"]
    operational_predicate: >
      The set of accounts that effectively hold priv_admin (direct role mapping, membership of group Admins, or
      holding composite role ops_superuser) is a subset of the accounts with an approval record that is valid
      (not expired) at assessment time in the privileged-access approval system of record.
    ground_truth_source: oracle computation of effective role membership from live Keycloak + approval system of record (hidden, complete)
    actions:
      - id: doc_priv_access_procedure
        outcomes: {documented: supports_satisfied, not_found: neutral}
      - id: approval_register
        outcomes: {register_current: supports_satisfied, register_stale_or_absent: supports_violated}
      - id: recon_direct_members_vs_approvals
        outcomes: {all_direct_approved: supports_satisfied, unapproved_direct_found: supports_violated}
      - id: recon_group_members_vs_approvals
        outcomes: {all_group_approved: supports_satisfied, unapproved_group_found: supports_violated}
      - id: kc_composite_role_analysis
        outcomes: {no_composite_paths: supports_satisfied, composite_path_members_present: neutral}
      - id: admin_events_role_grants
        outcomes: {no_recent_grants: supports_satisfied, recent_grants_present: neutral}
      - id: recon_effective_vs_approvals
        outcomes: {all_effective_approved: supports_satisfied, unapproved_effective_found: supports_violated}

  - id: IAM-04-DORMANT
    title: Dormant accounts beyond the experimental inactivity threshold are disabled
    framework_refs:
      nist_800_53: ["AC-02(03)"]
      nist_800_53a: ["AC-02(03) - accounts are disabled when they have been inactive for the defined time period"]
      nca_ecc_2_2024: ["2-2-3-5 (periodic review of identities and access rights)"]
      scf: ["IAC-15.3", "IAC-15"]
      scf_erl: ["E-IAM-07 Account Management Compliance Reviews"]
    operational_predicate: >
      No ENABLED human account created more than dormancy_threshold_days before assessment time lacks a successful
      LOGIN event within the last dormancy_threshold_days, according to the complete Keycloak event store.
      Service and break-glass accounts are out of scope.
    ground_truth_source: oracle SQL query over the complete Keycloak event_entity table + live user state
    actions:
      - id: doc_account_lifecycle_standard
        outcomes: {dormancy_rule_documented: supports_satisfied, not_found: neutral}
      - id: iam_dormancy_report
        outcomes: {report_current_no_dormant: supports_satisfied, report_current_dormant_listed: supports_violated, report_stale_or_absent: neutral}
      - id: kc_user_inventory_age
        outcomes: {no_old_enabled_accounts: supports_satisfied, old_enabled_accounts_present: neutral}
      - id: recon_events_api_vs_inventory
        outcomes: {all_old_accounts_active: supports_satisfied, unseen_old_accounts: supports_violated}
      - id: siem_login_export
        outcomes: {no_dormant_in_export: supports_satisfied, dormant_in_export: supports_violated, export_absent: neutral}

  - id: IAM-05-BREAKGLASS
    title: Emergency (break-glass) accounts are explicitly identified and controlled
    framework_refs:
      nist_800_53: ["AC-02(02)", "AC-02"]
      nist_800_53a: ["AC-02(02) - emergency accounts are removed/disabled after the defined time period", "AC-02i - access authorized based on intended system usage"]
      nca_ecc_2_2024: ["2-2-3-4 (privileged access management)"]
      scf: ["IAC-15.2", "IAC-16.1"]
      scf_erl: ["E-IAM-03 Privileged User Inventory"]
    operational_predicate: >
      (i) every account that is an emergency account per the identity registry is listed in the break-glass register
      AND carries attribute account_type=break_glass; (ii) the Linux host local emergency account bgroot is
      password-locked unless an emergency ticket is open; (iii) no break-glass Keycloak account has a LOGIN event in
      the event window that is not covered by an emergency ticket.
    ground_truth_source: oracle over hidden identity registry, live Keycloak attributes/events, live app-host /etc/shadow, ticket system of record
    actions:
      - id: doc_breakglass_procedure
        outcomes: {documented: supports_satisfied, not_found: neutral}
      - id: recon_register_vs_kc_attribute
        outcomes: {consistent: supports_satisfied, register_mismatch: supports_violated, register_absent: supports_violated}
      - id: kc_nonpersonal_priv_accounts
        outcomes: {all_identified: supports_satisfied, unidentified_nonpersonal_priv: supports_violated}
      - id: host_local_emergency_account
        outcomes: {locked: supports_satisfied, unlocked: supports_violated, absent: neutral}
      - id: emergency_ticket_records
        outcomes: {no_open_emergency: neutral, open_emergency_ticket: neutral, not_found: neutral}
      - id: kc_breakglass_login_events
        outcomes: {no_bg_logins: supports_satisfied, bg_logins_present: supports_violated}

  - id: IAM-06-ACCESS-REVIEW
    title: Periodic privileged access review occurred and its exceptions are tracked
    framework_refs:
      nist_800_53: ["AC-06(07)", "AC-02j"]
      nist_800_53a: ["AC-06(07)(a) - privileges assigned to roles/users are reviewed at the defined frequency", "AC-06(07)(b) - privileges are reassigned or removed if necessary"]
      nca_ecc_2_2024: ["2-2-3-5 (periodic review of identities and access rights)", "2-2-4"]
      scf: ["IAC-17"]
      scf_erl: ["E-IAM-01 Access Permission Review", "E-HRS-12 Role Review"]
    operational_predicate: >
      The latest completed privileged access review is at most access_review_max_age_days old at assessment time,
      its scope includes every account that effectively held priv_admin at the review date, and every 'revoke'
      decision is either implemented in the live directory or covered by an open exception ticket.
    ground_truth_source: oracle over access-review system of record (hidden, complete), live effective membership, ticket system of record
    actions:
      - id: doc_access_review_policy
        outcomes: {periodic_review_documented: supports_satisfied, not_found: neutral}
      - id: access_review_record
        outcomes: {current_signed: supports_satisfied, stale_or_unsigned: supports_violated, not_found: supports_violated}
      - id: recon_review_scope_vs_effective
        outcomes: {scope_complete: supports_satisfied, scope_gaps: supports_violated, no_review_to_compare: neutral}
      - id: recon_revocations_vs_directory
        outcomes: {all_revocations_implemented: supports_satisfied, unimplemented_revocations: supports_violated, no_revocations: neutral, no_review_to_compare: neutral}
      - id: exception_ticket_records
        outcomes: {exceptions_tracked: neutral, no_exception_tickets: neutral, not_found: neutral}
      - id: admin_events_role_removals
        outcomes: {removals_after_review: supports_satisfied, no_removals_after_review: neutral}

